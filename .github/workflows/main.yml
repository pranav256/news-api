name: Scrape latest data

on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'   # every 30 minutes, away from the hourly scheduling peak

concurrency:
  group: scrape-latest-data-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  scheduled:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Set up Rust
      run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

    - name: Cache Rust build
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

    - name: Run tests
      run: |
        cargo +stable fmt --check
        cargo +stable clippy --locked --all-targets -- -D warnings
        cargo +stable test --locked
        python -m unittest discover -s tests -v

    - name: Build Rust scraper
      run: cargo +stable build --release --locked

    - name: Run scraper
      run: ./target/release/news-api --rss-only

    - name: Commit and push if changed
      run: |
        git config user.name "Automated"
        git config user.email "actions@users.noreply.github.com"
        git add -- data/ in/ us/ gb/ ca/ au/
        if git diff --cached --quiet; then
          echo "No generated data changed."
          exit 0
        fi
        timestamp=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
        git commit -m "Latest data: ${timestamp}"
        git pull --rebase origin "${GITHUB_REF_NAME}"
        git push origin "HEAD:${GITHUB_REF_NAME}"
